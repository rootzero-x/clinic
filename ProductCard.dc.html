<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div onClick="{{ item.open }}" style="display:flex;flex-direction:column;gap:6px;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:12px;padding:8px 8px 10px;cursor:pointer;height:100%;box-sizing:border-box;font-family:var(--font-sans);position:relative">
  <div style="position:relative;aspect-ratio:1/1;border-radius:8px;background:{{ item.tint }};display:flex;align-items:center;justify-content:center;overflow:hidden">
    <div style="width:40%;height:54%;background:#fff;border-radius:5px;box-shadow:0 1px 3px rgba(20,30,22,.08);display:flex;flex-direction:column;overflow:hidden"><div style="height:30%;background:{{ item.ink }}"></div><div style="margin:8px 6px 0;height:3px;border-radius:2px;background:#e3e7e2"></div><div style="margin:4px 6px 0;width:60%;height:3px;border-radius:2px;background:#e3e7e2"></div></div>
    <sc-if value="{{ item.hasOld }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;top:6px;left:6px;background:#c93a3f;color:#fff;font-size:11px;font-weight:600;padding:3px 6px;border-radius:6px;font-variant-numeric:tabular-nums">{{ item.disc }}</span></sc-if>
    <button onClick="{{ item.fav }}" aria-label="Sevimlilarga" style="position:absolute;top:4px;right:4px;width:36px;height:36px;border-radius:50%;border:none;background:rgba(255,255,255,.92);color:{{ item.heartColor }};display:flex;align-items:center;justify-content:center;cursor:pointer">{{ item.i.heart }}</button>
    <sc-if value="{{ item.out }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;inset:0;background:rgba(255,255,255,.6);display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px"><span style="font-size:11px;font-weight:600;color:var(--text-secondary);background:#fff;border:1px solid var(--border-subtle);padding:3px 8px;border-radius:999px">Tugagan</span></div></sc-if>
  </div>
  <sc-if value="{{ item.rx }}" hint-placeholder-val="{{ false }}"><div style="display:flex;align-items:center;gap:4px;color:#2a62c9;font-size:11px;font-weight:600">{{ item.i.file }}<span>Retsept bilan</span></div></sc-if>
  <div style="font-size:13.5px;font-weight:500;line-height:1.3;color:var(--text-primary);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:35px">{{ item.name }}</div>
  <div style="font-size:12px;color:var(--text-muted)">{{ item.info }}</div>
  <div style="display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;margin-top:auto">
    <span style="font-size:15px;font-weight:700;color:var(--text-primary);font-variant-numeric:tabular-nums">{{ item.priceF }}</span>
    <sc-if value="{{ item.hasOld }}" hint-placeholder-val="{{ false }}"><span style="font-size:12px;color:var(--text-muted);text-decoration:line-through;font-variant-numeric:tabular-nums">{{ item.oldF }}</span></sc-if>
  </div>
  <sc-if value="{{ item.low }}" hint-placeholder-val="{{ false }}"><div style="font-size:11.5px;font-weight:500;color:#8a5a00">{{ item.stockText }}</div></sc-if>
  <sc-if value="{{ item.canAdd }}" hint-placeholder-val="{{ true }}">
    <button onClick="{{ item.add }}" style="height:36px;border-radius:8px;border:1px solid var(--accent);background:var(--accent-fill);color:var(--accent-text);font:600 13px var(--font-sans);display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer">{{ item.i.plus }}<span>Savatga</span></button>
  </sc-if>
  <sc-if value="{{ item.inCart }}" hint-placeholder-val="{{ false }}">
    <div onClick="{{ item.stop }}" style="height:36px;border-radius:8px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:space-between">
      <button onClick="{{ item.dec }}" aria-label="Kamaytirish" style="width:40px;height:36px;border:none;background:transparent;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer">{{ item.i.minus }}</button>
      <span style="font-size:14px;font-weight:600;font-variant-numeric:tabular-nums">{{ item.qty }}</span>
      <button onClick="{{ item.inc }}" aria-label="Ko'paytirish" style="width:40px;height:36px;border:none;background:transparent;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer">{{ item.i.plus }}</button>
    </div>
  </sc-if>
  <sc-if value="{{ item.out }}" hint-placeholder-val="{{ false }}">
    <button onClick="{{ item.notify }}" style="height:36px;border-radius:8px;border:1px solid var(--border-default);background:var(--surface-card);color:var(--text-secondary);font:500 13px var(--font-sans);cursor:pointer">Xabar berish</button>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;180px&quot;,&quot;height&quot;:&quot;320px&quot;},&quot;item&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;}}"></script>
</body>
</html>
